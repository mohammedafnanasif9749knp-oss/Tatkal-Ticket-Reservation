spring.application.name=demo
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flashy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.security.user.name=${APP_SECURITY_USERNAME}
spring.security.user.password=${APP_SECURITY_PASSWORD}
spring.security.user.roles=ADMIN

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
app.demo-data.enabled=false

# Local Kafka broker (KRaft)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=tatkal-booking-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
app.kafka.booking-topic=booking-events
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.demo.event.bookingEvent
